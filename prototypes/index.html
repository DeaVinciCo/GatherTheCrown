<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gather the Crown: Creats & Foes - Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
    }
    #game-canvas { 
      display: block; 
      width: 100vw; 
      height: 100vh;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      color: white;
      font-size: 16px;
    }
    .hud-top-left {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 10px;
      border: 2px solid #667eea;
    }
    .hud-top-right {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 10px;
      border: 2px solid #667eea;
    }
    .health-bar {
      width: 200px;
      height: 20px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 5px;
    }
    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff0000, #ff6b6b);
      transition: width 0.3s;
    }
    #menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 40px;
      border-radius: 20px;
      border: 3px solid #667eea;
      text-align: center;
      pointer-events: all;
    }
    #menu h1 {
      font-size: 48px;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #menu button {
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 20px;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.2s;
    }
    #menu button:hover {
      transform: scale(1.05);
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  
  <div id="hud" class="hidden">
    <div class="hud-top-left">
      <div><strong>🔵 Watcher Faction</strong></div>
      <div>Rider HP: <span id="player-hp">100</span>/100</div>
      <div class="health-bar">
        <div class="health-fill" id="player-hp-bar" style="width: 100%"></div>
      </div>
      <div style="margin-top: 10px">Creat HP: <span id="creat-hp">200</span>/200</div>
      <div class="health-bar">
        <div class="health-fill" id="creat-hp-bar" style="width: 100%"></div>
      </div>
      <div style="margin-top: 10px">⚡ Stamina: <span id="stamina">5</span>/5</div>
    </div>
    
    <div class="hud-top-right">
      <div>Position: <span id="position">1st</span> / 8</div>
      <div>Lap: <span id="lap">1</span> / 3</div>
      <div style="margin-top: 10px">Speed: <span id="speed">0</span> km/h</div>
      <div>💰 Gold: <span id="gold">1247</span>g</div>
      <div>👑 Shards: <span id="shards">12</span></div>
    </div>
  </div>

  <div id="menu">
    <h1>👑 Gather the Crown</h1>
    <p style="margin-bottom: 10px; font-size: 24px;">Creats & Foes</p>
    <p style="margin-bottom: 20px; font-size: 18px;">Prototype v0.4 - Enhanced Controls</p>
    <div style="margin-bottom: 20px; font-size: 14px; color: #aaa;">
      <p>🎮 Controls: WASD/Arrows = Move | Space = Jump | Shift = Boost</p>
    </div>
    <button id="start-race">🏁 Start Race</button>
    <button id="start-combat">⚔️ Combat Arena</button>
    <button id="start-creat-bond">🐉 Creat Bonding</button>
    <button id="start-vault">🏛️ Vault Exploration</button>
    <button id="show-kingdoms">🏰 Kingdom Stats</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
